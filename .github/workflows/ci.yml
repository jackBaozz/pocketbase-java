name: CI Release Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  jvm-tests:
    name: JVM Tests (${{ matrix.storage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [sqlite, mysql, postgresql]
    steps:
      - uses: actions/checkout@v5
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.6'
      - name: Run Maven Tests
        run: |
          if [ "${{ matrix.storage }}" = "sqlite" ]; then
            mvn -B test -Dstorage=${{ matrix.storage }} -DrequireDartSdkSmoke=true -Dtest='!AdminUiPlaywrightTest'
          else
            mvn -B test -Dstorage=${{ matrix.storage }} -DrequireDartSdkSmoke=true -Pexternal-db-drivers -Dtest='!AdminUiPlaywrightTest'
          fi

  admin-ui-e2e:
    name: Admin UI Playwright E2E
    runs-on: ubuntu-latest
    needs: [ui-build]
    steps:
      - uses: actions/checkout@v5
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Admin UI E2E
        run: mvn -B -Dstorage=sqlite -Dtest=AdminUiPlaywrightTest test

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
          git diff --exit-code -- ../src/main/resources/pocketbase-admin

  native-build-and-smoke:
    name: Native Build & Smoke
    runs-on: ubuntu-latest
    needs: [jvm-tests, ui-build, admin-ui-e2e]
    steps:
      - uses: actions/checkout@v5
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Native Image
        run: native-image --version
      - name: Build Native Image
        run: mvn -Pnative -DskipTests package
      - name: Native Smoke Test
        run: bash scripts/native-sqlite-smoke.sh ./target/pocketbase-java
