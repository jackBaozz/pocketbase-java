name: Native Release Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.3.0). Leave empty to only upload build artifacts without publishing a Release.'
        required: false
        default: ''
  push:
    tags: [ "v*" ]

jobs:
  native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            binary: pocketbase-java.exe
            asset_suffix: windows-amd64
            asset_extension: .exe
          - name: linux-amd64
            os: ubuntu-latest
            binary: pocketbase-java
            asset_suffix: linux-amd64
            asset_extension: ''
          - name: macos-arm64
            os: macos-latest
            binary: pocketbase-java
            asset_suffix: macos-arm64
            asset_extension: ''
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="$RELEASE_TAG"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -nE 's|.*<revision>[[:space:]]*([^<[:space:]]+)[[:space:]]*</revision>.*|\1|p' pom.xml | head -n1)
          fi
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve the project version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build Admin UI
        shell: bash
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build Native Image
        shell: bash
        run: mvn -B -gs settings.xml -s settings.xml -Pnative clean package -DskipTests

      - name: Stage Binary
        shell: bash
        run: |
          BINARY="target/${{ matrix.binary }}"
          ASSET="pocketbase-java-${{ matrix.asset_suffix }}-v${{ steps.version.outputs.version }}${{ matrix.asset_extension }}"
          if [ ! -f "$BINARY" ]; then
            echo "Native binary not found: $BINARY" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$BINARY" "dist/$ASSET"
          chmod +x "dist/$ASSET" 2>/dev/null || true
          ls -lh "dist/$ASSET"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbase-java-${{ matrix.asset_suffix }}-v${{ steps.version.outputs.version }}
          path: dist/pocketbase-java-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*/*
          fail_on_unmatched_files: true
          generate_release_notes: true
